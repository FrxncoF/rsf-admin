# Nginx del sistema (Ubuntu) → contenedor frontend del admin.
# Instalar en el servidor:
#   sudo cp /srv/rsf/admin/deploy/nginx-admin.conf /etc/nginx/sites-available/admin.residenciasanfrancisco.cl
#   sudo ln -s /etc/nginx/sites-available/admin.residenciasanfrancisco.cl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.residenciasanfrancisco.cl     # agrega HTTPS y la redirección
server {
    listen 80;
    listen [::]:80;
    server_name admin.residenciasanfrancisco.cl;

    # Fotos de residentes (el backend limita a 5 MB)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
