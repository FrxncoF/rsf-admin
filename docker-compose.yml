name: rsf-admin

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rsf_admin}
      POSTGRES_USER: ${POSTGRES_USER:-rsf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: no reporta "listo" mientras corre init.sql
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-rsf_admin}
      PGUSER: ${POSTGRES_USER:-rsf}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APIKEYCMF: ${APIKEYCMF:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administradora}
      UPLOAD_DIR: /app/uploads
      TZ: ${TZ:-America/Santiago}
    volumes:
      - uploads:/app/uploads
    networks: [backend, frontend]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [frontend]

volumes:
  pgdata:
  uploads:

networks:
  backend:
  frontend:
