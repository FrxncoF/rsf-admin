# Producción (Droplet con Nginx instalado en Ubuntu, que también sirve la landing).
# Uso (desde /srv/rsf/admin):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# El Nginx del sistema recibe https://admin.residenciasanfrancisco.cl (certbot) y lo
# reenvía al frontend en 127.0.0.1:8080 (ver deploy/nginx-admin.conf). Ningún contenedor
# queda expuesto a Internet. El docker-compose.override.yml de desarrollo NO va al servidor.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    # Solo accesible desde el propio servidor (el Nginx del sistema hace de puerta)
    ports: !override
      - "127.0.0.1:${ADMIN_LOCAL_PORT:-8080}:80"
    logging: *logging

  backend:
    logging: *logging

  db:
    logging: *logging
